[workspace]
name = "workloop"
version = "0.1.0"
channels = ["conda-forge", "https://prefix.dev/archont561/archont561"]
platforms = ["linux-64"]
requires-pixi = ">=0.81.0"

[dependencies]
python = ">=3.11,<3.14"
doit = "=0.37.0"
rust = "=1.99.1"
rust-src = "=1.99.1"
cargo-nextest = "=0.9.151"
cargo-llvm-cov = "=0.9.1"
cargo-deny = "=0.20.2"
cargo-audit = "=0.22.1"
taplo = "=0.10.0"
ruff = "=0.17.4"
mypy = "=2.4.1"
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
actionlint = "=1.7.12"
shellcheck = "=0.11.0"
lefthook = "=2.2.2"
convco = "=0.7.2"
bun = "=1.4.2"
vale = "=3.26.0"
lychee = "=0.24.2"
pixi-sandbox = { version = "=0.9.0", channel = "https://prefix.dev/archont561/archont561" }

[pypi-dependencies]
alint = "==0.22.0"
gherlint = "==0.5.0"
pytest-bdd = "==9.0.1"

[feature.dev]
platforms = ["linux-64"]

# Keep in lockstep with the `conda` matrix in .github/workflows/release.yml (decision-8).
[feature.packaging]
platforms = ["linux-64", "osx-arm64"]

[feature.packaging.dependencies]
rattler-build = "=0.80.0"

[feature.packaging.tasks]
package = "rattler-build build --recipe crates/workloop/recipe/recipe.yaml --variant-config crates/workloop/recipe/variants.yaml --output-dir output -c conda-forge"

[feature.pypi]
platforms = ["linux-64"]

[feature.pypi.dependencies]
maturin = "=1.16.0"

[feature.pypi.tasks]
package-pypi = "maturin build --release --locked --sdist --out dist/wheels --manifest-path crates/workloop/Cargo.toml"

[environments]
default = { features = ["dev"], solve-group = "default" }
packaging = { features = ["packaging"], no-default-feature = true }
pypi = { features = ["dev", "pypi"], solve-group = "default" }

[tasks]
setup = "sh scripts/bootstrap.sh"
install-hooks = "sh scripts/install_hooks.sh"
hooks-install = { depends-on = ["install-hooks"] }
bun-install = "bun install --frozen-lockfile"
agents-md = { cmd = "bun x --bun --no-install agents-md", depends-on = ["bun-install"] }
backlog = { cmd = "bun x --bun --no-install backlog", depends-on = ["bun-install"] }
skills = { cmd = "bun x --bun --no-install skills", depends-on = ["bun-install"] }
readme = { cmd = "sh -c 'rm -f README.md && bun x --bun --no-install readme-md-generator -p .readme/README.template.md -y'", depends-on = [
  "bun-install",
] }
docs-lint = { cmd = "bun x --bun --no-install markdownlint-cli2", depends-on = ["bun-install"] }
check-links = "lychee --no-progress README.md AGENTS.md CONTRIBUTING.md docs crates/*/README.md"
check-links-offline = "lychee --offline --no-progress README.md AGENTS.md CONTRIBUTING.md docs crates/*/README.md"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all --check"
clippy = "cargo clippy --workspace --all-targets --locked -- -D warnings"
test = "cargo nextest run --workspace --locked"
test-doc = "cargo test --workspace --doc --locked"
test-all = { depends-on = ["test", "test-doc"] }
build-release = "cargo build --release --locked --package workloop"
coverage = "sh -c 'mkdir -p coverage && cargo llvm-cov nextest --workspace --locked --lcov --output-path coverage/lcov.info --ignore-filename-regex \"(^|/)(tests/|features/)\" && doit check_coverage'"
test-tools = "python -m pytest tools/tests"
test-tools-cov = "sh -c 'mkdir -p coverage && python -m pytest tools/tests --cov=tools --cov-report=term-missing --cov-report=xml:coverage/tools.xml --cov-config=.coveragerc'"
lint-python = "ruff check tools"
format-python-check = "ruff format --check tools"
typecheck = "mypy tools"
automation = "doit"
claim = "python tools/claim.py --backlog-dir backlog"
alint = "alint check"
actionlint = "actionlint .github/workflows/*.yml"
lint-toml = "taplo fmt --check"
sandbox-check = "pixi-sandbox init --check --script-path scripts/restore.sh"
deny = "cargo deny check"
deny-offline = "cargo deny check bans licenses sources"
audit = "cargo audit"
lint-commit = "convco check --from-stdin --strip"
