# The prose check's source of truth: what Vale runs, and the house style this repository owns.
# `pixi run automation prose_sync` renders `.vale.ini` and `.vale/styles/Workloop/` from this file.

min_alert_level = "warning"

sources = ["README.md", "AGENTS.md", "CONTRIBUTING.md", "docs", "crates"]

packages = [
  "https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip",
  "https://github.com/vale-cli/write-good/releases/download/v0.4.1/write-good.zip",
]

accept = [
