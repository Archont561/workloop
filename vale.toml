  "workloop",
  "workloop-core",
  "clifacet",
  "alint",
  "gherlint",
  "archon",
  "archont561",
  "aider",
  "coderabbit",
  "deepseek",
  "devstral",
  "failover",
  "gemini",
  "glm",
  "goose",
  "localhost",
  "minimax",
  "mistral",
  "nemotron",
  "openai",
  "opencode",
  "openhands",
  "openrouter",
  "qwen",
  "universe",
  "worktree",
  "worktrees",
  # Build, lint, and release tooling.
  "actionlint",
  "assert_cmd",
  "automerge",
  "backlog",
  "bootstrap",
  "bun",
  "canary",
  "cargo",
  "clap",
  "clippy",
  "codecov",
  "conda",
  "convco",
  "devcontainer",
  "doctests",
  "dodo",
  "dogfood",
  "dogfooding",
  "doit",
  "frontmatter",
  "gh",
  "headless",
  "jsonc",
  "lcov",
  "lefthook",
  "lockfile",
  "lockfiles",
  "lychee",
  "manylinux",
  "markdownlint",
  "maturin",
  "monorepo",
  "msrv",
  "mypy",
  "nextest",
  "npm",
  "oidc",
  "pixi",
  "pixi-sandbox",
  "pluggable",
  "prerelease",
  "provenance",
  "pypi",
  "pytest",
  "rattler-build",
  "redacted",
  "redaction",
  "relock",
  "repo",
  "repos",
  "rstest",
  "ruff",
  "rustdoc",
  "rustfmt",
  "rustsec",
  "rustup",
  "sdist",
  "semver",
  "shellcheck",
  "stderr",
  "stdin",
  "stdout",
  "subcommand",
  "subcommands",
  "symlink",
  "taplo",
  "toml",
  "toolchain",
  "typecheck",
  "untrusted",
  "vendored",
  "vendoring",
  "yml",
