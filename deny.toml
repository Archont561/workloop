[graph]
all-features = true
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# Yanked-crate policy is enforced here only: `cargo-audit` has no equivalent key and
# rejects `.cargo/audit.toml` outright when one is added there.
yanked = "deny"
# Dev-only exception: RUSTSEC-2026-0374 marks basic-toml 0.1.10 unmaintained, and
# rstest-bdd =0.6.0 still reaches it through i18n-embed -> i18n-embed-impl ->
# i18n-config -> basic-toml. Removable once rstest-bdd stops depending on
# basic-toml; the non-runtime claim is re-verified by `pixi run automation
# advisory_exception` (tools/policy.py).
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "dev-only transitive via rstest-bdd =0.6.0 -> i18n-embed -> i18n-config -> basic-toml; workloop and workloop-core never link basic-toml at runtime" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
