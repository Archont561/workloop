[advisories]
# `cargo-audit` rejects any key it does not know here, so this file carries only what
# cargo-deny cannot express. Yanked-crate and severity policy live in `deny.toml`.
informational_warnings = ["unmaintained", "unsound", "notice"]
# Temporary dev-only exception; kept in sync with deny.toml and verified
# non-runtime by `pixi run automation advisory_exception`.
ignore = ["RUSTSEC-2026-0374"]
