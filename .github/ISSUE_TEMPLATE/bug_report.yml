name: Bug Report
description: Report reproducible unexpected behavior in workloop or tools/
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: What happened, including exact CLI output and exit code?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal commands from a clean checkout.
    validations:
      required: true
