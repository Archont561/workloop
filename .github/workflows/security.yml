name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Deny & Advisory Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.83.0
          cache: true
      - name: Verify advisory exception sync
        run: pixi run --locked automation advisory_exception
      - name: Run cargo-deny and cargo-audit
        run: |
          set -o pipefail
          report() {
            grep -E "error|warning|yanked|unmaintained" "$1" | head -20 | while IFS= read -r line; do
              echo "::error title=advisory-diag::$line"
            done
          }
          pixi run --locked deny >deny.log 2>&1 || { report deny.log; exit 1; }
          pixi run --locked audit >audit.log 2>&1 || { report audit.log; exit 1; }
