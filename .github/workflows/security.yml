name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - "deny.toml"
      - ".cargo/audit.toml"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Deny & Advisory Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.83.0
          cache: true
      - name: Verify advisory exception sync
        run: pixi run --locked automation advisory_exception
      - name: Run cargo-deny and cargo-audit
        run: |
          pixi run --locked deny
          pixi run --locked audit
