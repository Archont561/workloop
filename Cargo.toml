[workspace]
members = ["crates/workloop-core", "crates/workloop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
homepage = "https://github.com/Archont561/workloop"
repository = "https://github.com/Archont561/workloop"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]

[workspace.dependencies]
workloop-core = { path = "crates/workloop-core", version = "0.1.0" }
# No frontend features are enabled in the initial scaffold: each presentation mode is an
# optional dependency boundary (decision-2).
clifacet = { version = "0.5.0", default-features = false }
clap = { version = "4.6", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
] }
assert_cmd = "2.2"
predicates = "3.1"
rstest = "0.28.0"
rstest-bdd = "=0.6.0"
rstest-bdd-macros = { version = "=0.6.0", features = ["strict-compile-time-validation"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"

[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0
